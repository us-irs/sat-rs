variables:
  # GitLab can only cache paths inside the project directory.
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

default:
  image: rust:latest
  cache:
    key: ${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# Required by the serialport crate.
.udev:
  before_script:
    - apt-get update && apt-get install -y libudev-dev

check:
  extends: .udev
  script:
    - cargo check
    # Check example with static pool configuration
    - cargo check -p example-std --no-default-features

test:
  extends: .udev
  script:
    # The cargo bin folder of the image is in the PATH.
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
    - cargo nextest run --all-features
    - cargo test --doc --all-features

cross-check:
  parallel:
    matrix:
      - TARGET: [armv7-unknown-linux-gnueabihf, thumbv7em-none-eabihf]
  script:
    - rustup target add $TARGET
    - cargo check -p satrs --target=$TARGET --no-default-features

fmt:
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

docs:
  script:
    # rustup can only install toolchains with the CARGO_HOME it was installed to.
    - CARGO_HOME=/usr/local/cargo rustup toolchain install nightly --profile minimal
    - RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -p satrs --all-features --no-deps

clippy:
  extends: .udev
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

book:
  cache: []
  variables:
    MDBOOK_VERSION: v0.5.4
    MDBOOK_MERMAID_VERSION: v0.17.1
    MDBOOK_LINKCHECK2_VERSION: v0.13.0
  script:
    # Prebuilt binaries, because cargo install compiles all three tools on every run.
    - curl -sSL https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
    - curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
    - curl -sSL https://github.com/marxin/mdbook-linkcheck2/releases/download/${MDBOOK_LINKCHECK2_VERSION}/mdbook-linkcheck2-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
    - cd satrs-book && mdbook build
  artifacts:
    paths:
      - satrs-book/book/html/
    expire_in: 1 week

# Requires the CI/CD variable SSH_KNOWN_HOSTS, the public host key of the documentation server.
# The SSH private key is the secure file gitrunner_documentation. glab downloads secure files
# by ID only.
#
# The key is restricted with rrsync on the server, which puts /home/numalfix/www in front of
# every path.
deploy-book:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  cache: []
  needs: [book]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # The glab image has no rsync or ssh.
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "$CI_SERVER_PROTOCOL"
    - glab -R "$CI_PROJECT_PATH" securefile download 1 --path="$HOME/.ssh/deploy_key"
    # ssh refuses keys that other users can read.
    - chmod 600 ~/.ssh/deploy_key
    - rsync -rvz --delete -e "ssh -i $HOME/.ssh/deploy_key" satrs-book/book/html/ numalfix@documentation.irs.uni-stuttgart.de:/projects/sat-rs/book/
